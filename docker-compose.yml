# Môi trường dev/demo: SQL Server 2022 + API (PRD v3.0, mục 7.7.4).
#   Chỉ CSDL (chạy API bằng npm run dev):  docker compose up -d sqlserver
#   Toàn bộ:                                docker compose up -d --build
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Hãy tạo file .env từ .env.example}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_NAME: ThuyetMinhDB
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ENCRYPT: "true"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      RUN_SEED: ${RUN_SEED:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-Demo@12345}
      # Giá trị mặc định chỉ để chạy dev; môi trường thật phải đặt trong .env
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-secret-khong-dung-cho-production-0123}
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    ports:
      - "3000:3000"
    volumes:
      - api-storage:/app/api/storage
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  mssql-data:
  api-storage:
